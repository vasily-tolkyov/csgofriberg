name: 问题反馈
description: 报告游戏功能、界面或服务异常
title: '[Bug] '
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 单人模式
        - 查选手
        - 数据 / 选手资料
        - 界面 / 样式 / 主题
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？预期应该是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入单人模式
        2. 选择难度并开始游戏
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器与设备（以及使用的主题、语言）
      placeholder: Chrome 138 / Windows 11 / 暗色主题 / 中文
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、控制台报错、大致发生时间等（有助于排查）
