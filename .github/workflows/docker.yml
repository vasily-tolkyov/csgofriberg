name: CI and Docker

on:
  pull_request:
  push:
    branches: [main, lol-community-edition]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/tests/lol-data.test.mjs
      - run: node scripts/build-lol-data.mjs
      - run: node scripts/validate-lol-data.mjs
      - run: node scripts/validate-oracles-diff.mjs
      - run: node scripts/sync-runtime-player-data.mjs
      - run: pnpm test
      - run: pnpm build

  docker_smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-runtime-player-data.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Build smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: friberg-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start compose stack
        shell: bash
        run: |
          cat > .env.ci <<'EOF'
          IMAGE=friberg-ci:${{ github.sha }}
          APP_PORT=3000
          CORS_ORIGINS=http://127.0.0.1:3000
          TRUST_PROXY=false
          REDIS_PREFIX=friberg-ci:
          REDIS_COMMAND_TIMEOUT_MS=1500
          EOF
          docker compose --env-file .env.ci up -d redis app
      - name: Wait for healthcheck
        shell: bash
        run: |
          for i in {1..60}; do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$(docker compose --env-file .env.ci ps -q app)")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              docker compose --env-file .env.ci logs app redis
              exit 1
            fi
            sleep 2
          done
          docker compose --env-file .env.ci logs app redis
          exit 1
      - name: Verify API health
        run: curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:3000/api/health
      - name: Tear down smoke stack
        if: always()
        run: docker compose --env-file .env.ci down -v --remove-orphans

  docker_publish:
    needs: docker_smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-runtime-player-data.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
