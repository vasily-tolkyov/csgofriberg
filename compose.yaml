name: friberg

x-app-environment: &app-environment
  NODE_ENV: production
  NODE_OPTIONS: --max-old-space-size=192
  PORT: 3000
  TRUST_PROXY: ${TRUST_PROXY:-true}
  REDIS_URL: redis://redis:6379
  REDIS_PREFIX: ${REDIS_PREFIX:-friberg:}
  REDIS_REQUIRED: "true"
  REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-1500}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}

services:
  app:
    image: ${IMAGE:?set IMAGE in .env}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    environment: *app-environment
    ports:
      - 127.0.0.1:${APP_PORT:-3000}:3000
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
